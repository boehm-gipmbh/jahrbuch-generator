stages:
  - test
  - e2e
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.mvn_cache: &mvn_cache
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - .m2/repository

# ─── TEST ────────────────────────────────────────────────────────────────────

test:
  stage: test
  before_script:
    - docker run -d --name postgres-$CI_JOB_ID
        -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres
        -p 5432:5432 postgres:latest
    - until docker exec postgres-$CI_JOB_ID pg_isready -U postgres; do sleep 1; done
    - ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar
        -DgroupId=org.gphoto -DartifactId=gphoto2-java
        -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B
  script:
    - ./mvnw test -B
        -Dquarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
        -Dquarkus.datasource.reactive.url=postgresql://localhost:5432/postgres?ssl=false
        -Dquarkus.datasource.username=postgres
        -Dquarkus.datasource.password=postgres
  after_script:
    - docker stop postgres-$CI_JOB_ID && docker rm postgres-$CI_JOB_ID || true
  <<: *mvn_cache

# ─── E2E ─────────────────────────────────────────────────────────────────────

e2e:
  stage: e2e
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    DB_HOST: localhost
    DB_PORT: "5432"
    DB_USER: postgres
    DB_NAME: postgres
    DB_PASS: postgres
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
  before_script:
    - pkill -9 -f "quarkus" || true
    - pkill -9 -f "react-scripts" || true
    - pkill -9 -f "node.*frontend" || true
    - |
      for port in 18080 3000; do
        pid=$(lsof -ti:$port 2>/dev/null) && kill -9 $pid 2>/dev/null || true
      done
      sleep 3
    - docker run -d --name postgres-$CI_JOB_ID
        -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres
        -p 5432:5432 postgres:latest
    - until docker exec postgres-$CI_JOB_ID pg_isready -U postgres; do sleep 1; done
    - ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar
        -DgroupId=org.gphoto -DartifactId=gphoto2-java
        -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B
    - psql --version
    - node --version
    - mkdir -p captures
    - |
      for f in e2e-test-bild-1.jpg e2e-test-bild-2.jpg e2e-test-bild-3.jpg e2e-test-bild-4.jpg e2e-test-bild-5.jpg; do
        printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xd9' > "captures/$f"
      done
    - FREE_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
      MIGRATIONS_DIR="src/main/resources/db/migration"
      bash migrate.sh
    - |
      mkdir -p target
      ./mvnw compile quarkus:dev \
        -Dquarkus.profile=local \
        -Dquarkus.http.port=18080 \
        -Djahrbuch.captures.path="$CI_PROJECT_DIR/captures/" \
        -Dquarkus.hibernate-orm.database.generation=none \
        -Dquarkus.devservices.enabled=false \
        -Dquarkus.flyway.migrate-at-start=false \
        -Dquarkus.datasource.reactive.url=postgresql://localhost:5432/postgres?ssl=false \
        -Dquarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres \
        -Dquarkus.datasource.username=postgres \
        -Dquarkus.datasource.password=postgres \
        > target/e2e-backend.log 2>&1 &
    - |
      echo "Warte auf Backend..."
      for i in $(seq 1 240); do
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:18080/api/v1/auth/login \
          -H "Content-Type: application/json" -d '{"name":"x","password":"x"}' 2>/dev/null) || STATUS=000
        if [ "$STATUS" = "401" ] || [ "$STATUS" = "200" ]; then
          echo "Backend bereit nach ${i}s (HTTP $STATUS)"
          break
        fi
        sleep 1
      done
    - cd src/main/frontend && npm ci
    - sed -i 's|"http://localhost:8080"|"http://localhost:18080"|' package.json
    - sed -i "s|'http://localhost:8080|'http://localhost:18080|g" e2e/tests/*.spec.js
    - npm start > /tmp/frontend.log 2>&1 &
    - cd $CI_PROJECT_DIR
    - |
      echo "Warte auf Frontend..."
      for i in $(seq 1 120); do
        curl -sf http://localhost:3000 -o /dev/null 2>/dev/null && echo "Frontend bereit nach ${i}s" && break
        sleep 1
      done
    - cd src/main/frontend/e2e && npm ci
    - npx playwright install chromium
    - cd $CI_PROJECT_DIR
  script:
    - cd src/main/frontend/e2e && TEST_USERNAME=$E2E_TEST_USERNAME TEST_PASSWORD=$E2E_TEST_PASSWORD npx playwright test --retries=2
  after_script:
    - echo "=== Backend-Log ===" && cat target/e2e-backend.log || true
    - echo "=== Frontend-Log ===" && cat /tmp/frontend.log || true
    - pkill -9 -f "quarkus" || true
    - pkill -9 -f "react-scripts" || true
    - |
      for port in 18080 3000; do
        pid=$(lsof -ti:$port 2>/dev/null) && kill -9 $pid 2>/dev/null || true
      done
    - docker stop postgres-$CI_JOB_ID && docker rm postgres-$CI_JOB_ID || true
  artifacts:
    when: always
    paths:
      - src/main/frontend/e2e/playwright-report/
    expire_in: 7 days
  <<: *mvn_cache

# ─── BUILD ────────────────────────────────────────────────────────────────────

build:
  stage: build
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    - ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar
        -DgroupId=org.gphoto -DartifactId=gphoto2-java
        -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B
  script:
    - export REACT_APP_VERSION="fly-$(echo $CI_COMMIT_SHA | cut -c1-7) ($(date -u +%Y-%m-%d))"
    - node --version
    - ./mvnw -Pnative,frontend,fly clean package k8s:build k8s:push -B -Dquarkus.native.container-build=true -DskipTests
    - SHA=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
    - docker tag drdboehm/jahrbuch-generator:fly drdboehm/jahrbuch-generator:fly-$SHA
    - docker push drdboehm/jahrbuch-generator:fly-$SHA
  <<: *mvn_cache

# ─── DEPLOY ───────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: [build]
  before_script:
    - curl -L https://fly.io/install.sh | FLYCTL_INSTALL=/tmp/flyctl sh
    - export PATH="$PATH:/tmp/flyctl/bin"
  script:
    - flyctl deploy --image drdboehm/jahrbuch-generator:fly --strategy immediate
  environment:
    name: production
    url: https://jahrbuch-generator.fly.dev
