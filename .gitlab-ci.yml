stages:
  - sync
  - test
  - e2e

sync-frontend-pointer:
  stage: sync
  image: alpine/git
  only:
    - schedules
    - web
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
    - git submodule update --remote src/main/frontend
    - |
      if git diff --quiet src/main/frontend; then
        echo "Submodul-Pointer bereits aktuell."
        exit 0
      fi
    - SHORT_SHA=$(git -C src/main/frontend rev-parse --short HEAD)
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@noreply.local"
    - git add src/main/frontend
    - 'git commit -m "Chore: Submodul-Pointer automatisch auf Frontend ${SHORT_SHA}"'
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:main

test:
  stage: test
  image: eclipse-temurin:21-jdk
  services:
    - postgres:latest
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres
    QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/postgres?ssl=false
    QUARKUS_DATASOURCE_USERNAME: postgres
    QUARKUS_DATASOURCE_PASSWORD: postgres
  before_script:
    - ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar
      -DgroupId=org.gphoto -DartifactId=gphoto2-java
      -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B
  script:
    - ./mvnw test -B
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - ~/.m2/repository

e2e:
  stage: e2e
  image: eclipse-temurin:21-jdk
  services:
    - postgres:latest
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/postgres
    QUARKUS_DATASOURCE_REACTIVE_URL: postgresql://postgres:5432/postgres?ssl=false
    QUARKUS_DATASOURCE_USERNAME: postgres
    QUARKUS_DATASOURCE_PASSWORD: postgres
    QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
    JAHRBUCH_CAPTURES_PATH: /tmp/captures/
    DB_HOST: postgres
    DB_USER: postgres
    DB_PASS: postgres
    DB_NAME: postgres
    PORT: "3000"
    CI: "true"
  before_script:
    # Submodul von lokalem GitLab holen (URL-Override vor dem Init)
    - git config submodule.src/main/frontend.url git@dboehm-System-Product-Name:jamsintown/jahrbuch-generator/jahrbuch-generator-frontend.git
    - git submodule update --init src/main/frontend
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs postgresql-client
    - ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar
      -DgroupId=org.gphoto -DartifactId=gphoto2-java
      -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B
    - ./mvnw package -DskipTests -B
    - mkdir -p /tmp/captures
    - npm ci --prefix src/main/frontend
    - npm ci --prefix src/main/frontend/e2e
    - npx --prefix src/main/frontend/e2e playwright install chromium --with-deps
  script:
    - java -jar target/quarkus-app/quarkus-run.jar &
    - |
      for i in $(seq 1 30); do
        curl -sf http://localhost:8080/api/v1/info && break
        echo "Warte auf Backend ($i/30)..."
        sleep 2
      done
    - npx --prefix src/main/frontend/e2e playwright test
  artifacts:
    when: always
    paths:
      - src/main/frontend/e2e/playwright-report/
    expire_in: 1 week
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths:
      - ~/.m2/repository
