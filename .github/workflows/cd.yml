name: CD — Deploy to Fly.io

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: gphoto2-java lokal installieren
        run: ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar -DgroupId=org.gphoto -DartifactId=gphoto2-java -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B

      - name: Native Image bauen und zu Docker Hub pushen
        run: ./mvnw -Pnative,frontend,fly clean package k8s:build k8s:push -B -Dquarkus.native.container-build=true

      - name: Image mit Git-SHA taggen
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          docker tag drdboehm/jahrbuch-generator:fly drdboehm/jahrbuch-generator:$SHA
          docker push drdboehm/jahrbuch-generator:$SHA

      - name: flyctl einrichten
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --image drdboehm/jahrbuch-generator:fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
