name: E2E Tests

on:
  # Deaktiviert — E2E läuft via lokale GitLab-Pipeline.
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: gphoto2-java lokal installieren
        run: ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar -DgroupId=org.gphoto -DartifactId=gphoto2-java -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B

      - name: DB-Migration ausführen
        run: |
          export FREE_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/postgres"
          export MIGRATIONS_DIR="src/main/resources/db/migration"
          bash migrate.sh

      - name: Testbilder anlegen
        run: |
          mkdir -p captures
          for f in e2e-test-bild-1.jpg e2e-test-bild-2.jpg e2e-test-bild-3.jpg e2e-test-bild-4.jpg e2e-test-bild-5.jpg; do
            printf '\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00\xff\xd9' > "captures/$f"
          done

      - name: Backend starten
        run: |
          mkdir -p target/classes/frontend
          ./mvnw compile quarkus:dev \
            -Dquarkus.profile=local \
            -Djahrbuch.captures.path="$GITHUB_WORKSPACE/captures/" \
            -Dquarkus.hibernate-orm.database.generation=none \
            -Dquarkus.devservices.enabled=false \
            > target/e2e-backend.log 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
          echo "Warte auf Backend..."
          for i in $(seq 1 120); do
            curl -sf http://localhost:8080/ -o /dev/null 2>/dev/null && echo "Backend bereit nach ${i}s" && break
            sleep 1
          done

      - name: npm install (Frontend)
        run: npm ci
        working-directory: src/main/frontend

      - name: npm install (E2E)
        run: npm ci
        working-directory: src/main/frontend/e2e

      - name: Frontend starten
        run: |
          npm start > /tmp/frontend.log 2>&1 &
          echo "Warte auf Frontend..."
          for i in $(seq 1 120); do
            curl -sf http://localhost:3000 -o /dev/null 2>/dev/null && echo "Frontend bereit nach ${i}s" && break
            sleep 1
          done
        working-directory: src/main/frontend

      - name: Playwright Browsers installieren
        run: npx playwright install --with-deps chromium
        working-directory: src/main/frontend/e2e

      - name: Playwright Tests ausführen
        run: npx playwright test --retries=2
        working-directory: src/main/frontend/e2e
        env:
          TEST_USERNAME: ${{ secrets.E2E_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_NAME: postgres
          DB_PASS: postgres

      - name: Test-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/main/frontend/e2e/playwright-report/

      - name: Backend-Log bei Fehler hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: target/e2e-backend.log
