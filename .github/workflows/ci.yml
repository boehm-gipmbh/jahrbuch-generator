name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  submodule-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Submodul-Pointer auf master prüfen
        run: |
          cd src/main/frontend
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::Submodul src/main/frontend zeigt auf $(git rev-parse --short HEAD), der nicht auf origin/master liegt. Zuerst den Frontend-Branch in master mergen!"
            exit 1
          fi
          echo "OK: Submodul-Pointer $(git rev-parse --short HEAD) ist auf origin/master erreichbar."

  test:
    runs-on: ubuntu-latest
    needs: [submodule-check]
    if: always() && (needs.submodule-check.result == 'success' || needs.submodule-check.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: gphoto2-java lokal installieren
        run: ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar -DgroupId=org.gphoto -DartifactId=gphoto2-java -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B

      - name: Tests ausführen
        run: ./mvnw test -B
