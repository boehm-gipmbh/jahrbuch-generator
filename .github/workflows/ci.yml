name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: gphoto2-java lokal installieren
        run: ./mvnw install:install-file -Dfile=libs/gphoto2-java-1.5-SNAPSHOT.jar -DgroupId=org.gphoto -DartifactId=gphoto2-java -Dversion=1.5-SNAPSHOT -Dpackaging=jar -B

      - name: Tests ausführen
        run: ./mvnw test -B
