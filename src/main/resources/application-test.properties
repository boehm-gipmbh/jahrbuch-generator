# DevServices deaktiviert: Docker 29+ inkompatibel mit Testcontainers 1.20.x (VERSION_1_32 probe)
# Vor Tests starten: docker run -d --rm --name postgres-test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:latest
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
quarkus.datasource.reactive.url=postgresql://localhost:5432/postgres?ssl=false
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import-test.sql
resend.mock=true