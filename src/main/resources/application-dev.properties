# Fly.io Proxy als lokale DB (fly proxy 5433:5432 -a jahrbuch-generator-pg)
quarkus.http.port=8080
quarkus.datasource.reactive.url=postgresql://localhost:5433/postgres?ssl=false&sslmode=disable
quarkus.datasource.username=${DEV_DB_USERNAME}
quarkus.datasource.password=${DEV_DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/postgres

quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.log.sql=true

jahrbuch.captures.station=true
jahrbuch.captures.path=/home/dboehm/git/git.quarkus/jahrbuch-generator.git/captures/

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,https://jahrbuch-generator.fly.dev

resend.mock=true
