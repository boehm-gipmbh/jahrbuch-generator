%dev.quarkus.http.port=8080
# %dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jamsintown
###### Proxy URL, username und passwort f�r free Postgres bei Fly.io
# Fly.io Proxy (default): port 5433
# Lokale Docker-DB:       port 5432 → DEV_DB_PORT=5432 in .env setzen
%dev.quarkus.datasource.reactive.url=postgresql://localhost:${DEV_DB_PORT:5433}/postgres?ssl=false&sslmode=disable
%dev.quarkus.datasource.username=${DEV_DB_USERNAME}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD}

#
#publisher.name=JamsInTown
#
# Pfad f�r erfasste Bilder
jahrbuch.captures.path=/data/captures/
jahrbuch.captures.station=false
%dev.jahrbuch.captures.station=true

# als ganzzahliges Vielfaches von 1048576 (entspricht 1 MiB)
jahrbuch.upload.max-size=2097152
jahrbuch.upload.allowed-types=.jpg,.jpeg,.png,.gif,.bmp,.webp,.tiff,.tif

# %dev.jahrbuch.captures.path=/home/dboehm/jahrbuch-generator/captures/
%dev.jahrbuch.captures.path=/home/dboehm/git/git.quarkus/jahrbuch-generator.git/captures/

quarkus.datasource.db-kind=postgresql
#quarkus.hibernate-orm.sql-load-script=import.sql
#%dev.quarkus.hibernate-orm.database.generation=drop-and-create
#%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql
#%test.quarkus.hibernate-orm.sql-load-script=import-dev.sql
%dev.quarkus.hibernate-orm.log.sql=true

%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:3000,https://jahrbuch-generator.fly.dev
