# ── Datenbank ────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc=true
# Default für Native-Build (wird zur Laufzeit via -D in Dockerfile.fly überschrieben)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
# Idle-Verbindungen nach 10 min recyclen (Fly.io trennt nach ~30 min)
quarkus.datasource.reactive.idle-timeout=PT10M
quarkus.datasource.reactive.reconnect-attempts=3
quarkus.datasource.reactive.reconnect-interval=PT1S

# ── Flyway ────────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# ── Uploads ───────────────────────────────────────────────────────────────────
jahrbuch.captures.path=/data/captures/
jahrbuch.captures.station=false
jahrbuch.fotobox.token=
jahrbuch.upload.max-size=2097152
jahrbuch.upload.allowed-types=.jpg,.jpeg,.png,.gif,.bmp,.webp,.tiff,.tif

# ── HTTP ──────────────────────────────────────────────────────────────────────
quarkus.http.limits.max-body-size=524288000
quarkus.resteasy-reactive.multipart.max-file-size=524288000

# ── E-Mail (Resend) ───────────────────────────────────────────────────────────
resend.api.key=${RESEND_API_KEY:not-set}
resend.mock=false
resend.from=drdboehm@jamsintown.de
jahrbuch.app.url=https://jahrbuch-generator.fly.dev

# ── JWT ───────────────────────────────────────────────────────────────────────
smallrye.jwt.sign.key.location=jwt/private-key.pem
mp.jwt.verify.publickey.location=jwt/public-key.pem
mp.jwt.verify.issuer=https://example.com/issuer

# ── OpenAPI ───────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.store-schema-directory=${user.dir}

# ── Native Image ──────────────────────────────────────────────────────────────
quarkus.native.resources.includes=jwt/public-key.pem,jwt/private-key.pem,db/migration/*.sql,build-info.properties
