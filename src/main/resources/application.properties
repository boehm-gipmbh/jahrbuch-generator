    # ── Datenbank ────────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc=true
# Default für Native-Build (wird zur Laufzeit via -D in Dockerfile.fly überschrieben)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres
# Idle-Verbindungen nach 10 min recyclen (Fly.io trennt nach ~30 min)
quarkus.datasource.reactive.idle-timeout=PT10M
quarkus.datasource.reactive.reconnect-attempts=3
quarkus.datasource.reactive.reconnect-interval=PT1S

# ── Flyway ────────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

# ── Uploads ───────────────────────────────────────────────────────────────────
jahrbuch.captures.path=/data/captures/
jahrbuch.captures.station=false
jahrbuch.fotobox.token=
jahrbuch.upload.max-size=2097152
jahrbuch.upload.allowed-types=.jpg,.jpeg,.png,.gif,.bmp,.webp,.tiff,.tif

# ── HTTP ──────────────────────────────────────────────────────────────────────
quarkus.http.limits.max-body-size=524288000
quarkus.resteasy-reactive.multipart.max-file-size=524288000

# ── E-Mail (Resend) ───────────────────────────────────────────────────────────
resend.api.key=${RESEND_API_KEY:not-set}
resend.mock=false
resend.from=drdboehm@jamsintown.de
jahrbuch.app.url=https://jahrbuch-generator.fly.dev

# ── Kafka (Reactive Messaging) ────────────────────────────────────────────
# Dev: Quarkus Dev Services startet Redpanda automatisch
# Prod: KAFKA_BOOTSTRAP_SERVERS env-Variable setzen
mp.messaging.outgoing.video-processing.connector=smallrye-kafka
mp.messaging.outgoing.video-processing.topic=video-processing
mp.messaging.outgoing.video-processing.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Test: kein Docker verfügbar → Dev Services deaktivieren, In-Memory-Connector verwenden
%test.quarkus.kafka.devservices.enabled=false
%test.mp.messaging.outgoing.video-processing.connector=smallrye-in-memory
%test.quarkus.s3.devservices.enabled=false
%test.quarkus.http.test-port=0

# ── JWT ───────────────────────────────────────────────────────────────────────
smallrye.jwt.sign.key.location=jwt/private-key.pem
mp.jwt.verify.publickey.location=jwt/public-key.pem
mp.jwt.verify.issuer=https://example.com/issuer

# ── OpenAPI ───────────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.store-schema-directory=${user.dir}

# ── Native Image ──────────────────────────────────────────────────────────────
quarkus.native.resources.includes=jwt/public-key.pem,jwt/private-key.pem,db/migration/*.sql,build-info.properties

# ── S3 / MinIO (quarkus-amazon-s3) ───────────────────────────────────────────
quarkus.s3.endpoint-override=${MINIO_ENDPOINT:http://localhost:9000}
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minioadmin}
quarkus.s3.sync-client.type=url
minio.bucket=${MINIO_BUCKET:captures}
