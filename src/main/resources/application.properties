## quarkus.http.port=8080
%dev.quarkus.http.port=8080
# %dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jamsintown
###### Fly.io Proxy (default dev)
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5433/postgres?ssl=false&sslmode=disable
%dev.quarkus.datasource.username=${DEV_DB_USERNAME}
%dev.quarkus.datasource.password=${DEV_DB_PASSWORD}

###### Lokale Docker-DB (./mvnw compile quarkus:dev -Dquarkus.profile=local)
%local.quarkus.datasource.reactive.url=postgresql://localhost:5432/postgres?ssl=false&sslmode=disable
%local.quarkus.datasource.username=postgres
%local.quarkus.datasource.password=postgres
%local.quarkus.http.port=8080
%local.quarkus.http.cors=true
%local.quarkus.http.cors.origins=http://localhost:3000
%local.jahrbuch.captures.station=true
%local.jahrbuch.captures.path=/home/dboehm/git/git.quarkus/jahrbuch-generator.git/captures/
%local.quarkus.hibernate-orm.log.sql=true

#
#publisher.name=JamsInTown
#
# Pfad f�r erfasste Bilder
jahrbuch.captures.path=/data/captures/
jahrbuch.captures.station=false
%dev.jahrbuch.captures.station=true

# als ganzzahliges Vielfaches von 1048576 (entspricht 1 MiB)
jahrbuch.upload.max-size=2097152
jahrbuch.upload.allowed-types=.jpg,.jpeg,.png,.gif,.bmp,.webp,.tiff,.tif

# %dev.jahrbuch.captures.path=/home/dboehm/jahrbuch-generator/captures/
%dev.jahrbuch.captures.path=/home/dboehm/git/git.quarkus/jahrbuch-generator.git/captures/

quarkus.datasource.db-kind=postgresql

# JDBC-Datasource (nur für Flyway, nicht für die App)
quarkus.datasource.jdbc=true
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/postgres
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgres

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# Bestehende DBs übernehmen: alle bisherigen Migrationen als eingespielt markieren
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1

#quarkus.hibernate-orm.sql-load-script=import.sql
#%dev.quarkus.hibernate-orm.database.generation=drop-and-create
#%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql
#%test.quarkus.hibernate-orm.sql-load-script=import-dev.sql
%dev.quarkus.hibernate-orm.log.sql=true

%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:3000,https://jahrbuch-generator.fly.dev
# erlaubt ALLE Origins (f�r Testen)
# %dev.quarkus.http.cors.origins=*
# wenn du nur dein Frontend erlauben willst (empfohlen):
# quarkus.http.cors.origins=https://mein-frontend.fly.dev

smallrye.jwt.sign.key.location=jwt/private-key.pem
mp.jwt.verify.publickey.location=jwt/public-key.pem
mp.jwt.verify.issuer=https://example.com/issuer
quarkus.native.resources.includes=jwt/public-key.pem,jwt/private-key.pem
