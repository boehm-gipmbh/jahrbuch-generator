# Capture Station: kommuniziert per REST-API mit Fly.io (kein lokales PostgreSQL)
# Start: ./mvnw compile quarkus:dev -Dquarkus.profile=station
quarkus.datasource.active=false
quarkus.hibernate-orm.active=false
quarkus.flyway.migrate-at-start=false
quarkus.scheduler.enabled=false

quarkus.http.port=8090
quarkus.http.cors=true
quarkus.http.cors.origins=*

jahrbuch.captures.station=true
jahrbuch.captures.path=${user.home}/captures/

jahrbuch.fotobox.capture-user=admin
# Kein Default-Token — muss per .station-token Datei oder Umgebungsvariable gesetzt werden
# Token generieren: POST /api/v1/gruppen/{groupId}/fotobox-token
jahrbuch.fotobox.token=
jahrbuch.flyio.url=https://jahrbuch-generator.fly.dev

resend.mock=true
